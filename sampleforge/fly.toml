# fly.toml app configuration file generated for sampleforge on 2026-10-28T10:38:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sampleforge'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  SAMPLEFORGE_DEVICE = 'cpu'
  SAMPLEFORGE_ENVIRONMENT = 'production'
  SAMPLEFORGE_STORAGE_BACKEND = 'local'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
