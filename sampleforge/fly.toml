app = "sampleforge-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SAMPLEFORGE_ENVIRONMENT = "production"
  SAMPLEFORGE_STORAGE_BACKEND = "local"
  SAMPLEFORGE_DEVICE = "cpu"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
